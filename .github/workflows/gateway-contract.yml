name: Gateway Contract

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "catalog/**"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/gateway-contract.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  gateway-contract:
    name: Gateway Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm --prefix api ci

      - name: Start Docker Compose stack
        env:
          CATALOG_PROVIDER: sample
          CATALOG_SAMPLE_MODE: "true"
          CATALOG_REGISTRY_TOKEN: ${{ github.token }}
        run: docker compose up -d --wait

      - name: Wait for gateway health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Gateway did not become healthy in time"
          exit 1

      - name: MCP and catalog live contract tests
        run: npm --prefix api run test:contract

      - name: Policy contract tests
        run: npm --prefix api run test:policy

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
