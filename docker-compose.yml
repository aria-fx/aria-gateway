services:
  # --- ARIA Distribution Gateway (reverse proxy) ---
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    restart: unless-stopped

  # --- Catalog API ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8080}"
      CORS_ORIGIN: "*"
      CATALOG_REGISTRY_TOKEN: "${CATALOG_REGISTRY_TOKEN:-}"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # --- Web Catalog UI ---
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health.txt"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
