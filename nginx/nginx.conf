# ARIA Distribution Gateway — nginx reverse proxy with URL rewrite rules
#
# Routing strategy:
#   / and /assets/*            → React UI (port 5173 / ui container)
#   /catalog/*                 → Catalog API (port 3001 / api container)
#   /mcp, /mcp/*               → MCP server endpoint for Claude Desktop
#   /.well-known/*             → Plugin manifests (ChatGPT, Claude)
#   /openapi.json              → OpenAPI spec for AI platform integration
#   /v1/*                      → Versioned API alias (rewrites to /catalog/*)
#   /chatgpt/*                 → ChatGPT-specific rewrite (→ /catalog/*)
#   /claude/*                  → Claude-specific rewrite (→ /catalog/*)

upstream aria_api {
    server api:3001;
    keepalive 16;
}

upstream aria_ui {
    server ui:80;
    keepalive 8;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=plugin_limit:1m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS for AI platforms (ChatGPT, Claude)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Consumer-Id, X-Sensitivity-Ceiling" always;

    # Preflight
    location = /options_handler {
        return 204;
    }
    if ($request_method = OPTIONS) {
        return 204;
    }

    # -------------------------------------------------------------------------
    # Health check
    # -------------------------------------------------------------------------
    location = /health {
        proxy_pass http://aria_api/health;
        proxy_http_version 1.1;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Plugin manifests (ChatGPT / AI platforms)
    # -------------------------------------------------------------------------
    location /.well-known/ {
        limit_req zone=plugin_limit burst=20 nodelay;
        proxy_pass http://aria_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location = /openapi.json {
        limit_req zone=plugin_limit burst=20 nodelay;
        proxy_pass http://aria_api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # MCP Server — Claude Desktop integration
    # POST /mcp  →  JSON-RPC 2.0 over HTTP
    # GET  /mcp  →  Server info / discovery
    # -------------------------------------------------------------------------
    location /mcp {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://aria_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # MCP uses chunked streaming for SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # Versioned API alias: /v1/* → /catalog/*
    # Allows AI platforms to use a stable versioned prefix
    # -------------------------------------------------------------------------
    location /v1/ {
        limit_req zone=api_limit burst=100 nodelay;
        rewrite ^/v1/(.*)$ /catalog/$1 break;
        proxy_pass http://aria_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------------------------
    # ChatGPT integration: /chatgpt/* → /catalog/*
    # When ChatGPT calls the plugin API it goes through this prefix
    # -------------------------------------------------------------------------
    location /chatgpt/ {
        limit_req zone=api_limit burst=100 nodelay;
        rewrite ^/chatgpt/(.*)$ /catalog/$1 break;
        proxy_pass http://aria_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Tag requests from ChatGPT
        proxy_set_header X-Consumer-Id "chatgpt-plugin";
        proxy_set_header X-Sensitivity-Ceiling "internal";
    }

    # -------------------------------------------------------------------------
    # Claude Enterprise integration: /claude/* → /catalog/*
    # Claude's enterprise catalog API calls route through here
    # -------------------------------------------------------------------------
    location /claude/ {
        limit_req zone=api_limit burst=100 nodelay;
        rewrite ^/claude/(.*)$ /catalog/$1 break;
        proxy_pass http://aria_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Consumer-Id "claude-enterprise";
        proxy_set_header X-Sensitivity-Ceiling "internal";
    }

    # -------------------------------------------------------------------------
    # Catalog API
    # -------------------------------------------------------------------------
    location /catalog/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://aria_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # -------------------------------------------------------------------------
    # Web Catalog UI — catch-all (SPA)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://aria_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_intercept_errors off;
    }
}
